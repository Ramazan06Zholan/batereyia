<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Knowledge Battery</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@700;800&display=swap">
<style>
:root{--ink:#1d1457;--gold:#ffd21f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ink:#1d1457}}
:root[data-theme="dark"]{--ink:#1d1457}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0}
body{min-height:100vh;padding:22px;color:#fff;font-family:Nunito,Arial,sans-serif;font-weight:800;background:radial-gradient(circle at 15% 8%,#8a5cff 0,transparent 42%),radial-gradient(circle at 90% 90%,#ff4fa3 0,transparent 35%),linear-gradient(160deg,#2b1fa0,#5b2fd0 60%,#7b3be0)}
.stroke{font-family:'Lilita One',Impact,sans-serif;-webkit-text-stroke:6px var(--ink);paint-order:stroke fill}
h1{font-size:clamp(40px,7vw,96px);color:var(--gold);text-align:center;line-height:1;text-shadow:0 8px 0 var(--ink)}
.sub{text-align:center;font-size:clamp(20px,3vw,40px);margin:14px 0 30px;color:#fff;-webkit-text-stroke:4px var(--ink)}
.wrap{max-width:1500px;margin:0 auto;display:grid;grid-template-columns:1fr 340px;gap:26px;align-items:start}
.bats{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
.bat{position:relative;background:var(--c);border:6px solid var(--ink);border-radius:30px;padding:16px 12px 20px;display:flex;flex-direction:column;align-items:center;gap:12px;box-shadow:0 10px 0 var(--ink)}
.bat::before{content:"";position:absolute;top:-20px;left:50%;width:48px;height:14px;margin-left:-24px;background:var(--ink);border-radius:7px 7px 0 0}
.seg{display:flex;gap:5px;width:100%;background:var(--ink);padding:5px;border-radius:12px}
.seg i{flex:1;height:24px;border-radius:6px;background:rgba(255,255,255,.2)}
.seg i.on{background:#fff}
.bat svg{width:100%;max-width:150px}
.plate{width:100%;min-height:3.4em;display:flex;align-items:center;justify-content:center;text-align:center;padding:8px 6px;border-radius:14px;background:#fff;color:var(--ink);font-family:'Lilita One',sans-serif;font-size:clamp(16px,1.7vw,24px);line-height:1.1}
.big{width:100px;height:100px;border-radius:50%;border:6px solid var(--ink);cursor:pointer;background:radial-gradient(circle at 35% 28%,rgba(255,255,255,.7),transparent 42%),var(--c);box-shadow:0 9px 0 var(--ink);transition:transform .08s,box-shadow .08s}
.big:active{transform:translateY(7px);box-shadow:0 2px 0 var(--ink)}
.big:focus-visible,.btn:focus-visible,input:focus-visible{outline:4px solid #fff;outline-offset:3px}
.count{font-size:44px;color:#fff;-webkit-text-stroke:5px var(--ink);line-height:1}
.panel{background:#1f7ae0;border:6px solid var(--ink);border-radius:30px;padding:20px;display:flex;flex-direction:column;gap:14px;box-shadow:0 10px 0 var(--ink)}
.panel h2{font-size:34px;color:var(--gold);text-align:center;-webkit-text-stroke:4px var(--ink)}
.row{display:flex;align-items:center;gap:10px;font-size:15px}
.row .dot{width:16px;height:16px;border-radius:50%;background:var(--c);border:3px solid var(--ink);flex:none}
.row .bar{flex:1;height:14px;border-radius:8px;background:var(--ink);overflow:hidden}
.row .bar b{display:block;height:100%;background:var(--c);width:0;transition:width .5s}
.row span{min-width:62px;text-align:right}
.n{display:flex;align-items:center;justify-content:space-between;background:#fff;color:var(--ink);border-radius:14px;padding:8px 12px;border:4px solid var(--ink)}
.n input{width:70px;font:inherit;font-size:24px;text-align:center;border:0;background:transparent;color:var(--ink)}
.gauge{height:30px;border-radius:16px;background:var(--ink);padding:5px}
.gauge b{display:block;height:100%;width:0;border-radius:11px;background:linear-gradient(90deg,#e63946,#ff8a1f,#ffd21f,#32d15b);transition:width .6s}
.pct{text-align:center;font-size:56px;color:#fff;-webkit-text-stroke:6px var(--ink);line-height:1}
.btns{display:flex;gap:10px}
.btn{flex:1;font-family:'Lilita One',sans-serif;font-size:19px;background:var(--gold);color:var(--ink);border:4px solid var(--ink);border-radius:14px;padding:10px;cursor:pointer;box-shadow:0 5px 0 var(--ink)}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.say{max-width:560px;margin:34px auto 0;text-align:center;background:#fff;color:var(--ink);border:6px solid var(--ink);border-radius:26px;padding:14px 22px;font-family:'Lilita One',sans-serif;font-size:clamp(22px,3vw,36px);box-shadow:0 8px 0 var(--ink)}
@media (max-width:1000px){.wrap{grid-template-columns:1fr}.bats{grid-template-columns:repeat(2,1fr)}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head>
<body>
<h1 class="stroke">Knowledge Battery</h1>
<p class="sub stroke">How did you learn today?</p>
<div class="wrap">
  <div class="bats" id="bats"></div>
  <aside class="panel">
    <h2 class="stroke">Teacher</h2>
    <label class="n">Students <input id="N" type="number" min="1" max="40" value="12" aria-label="Number of students"></label>
    <div class="n"><span id="ans">Answered: 0 / 12</span></div>
    <div id="rows" style="display:flex;flex-direction:column;gap:10px"></div>
    <div class="pct stroke" id="pct">0%</div>
    <div class="gauge"><b id="g"></b></div>
    <div class="btns"><button class="btn" id="undo">Undo</button><button class="btn" id="reset">Reset</button></div>
  </aside>
</div>
<div class="say">Your opinion matters!</div>
<script>
const D=[
{k:'r',c:'#e63946',t:'I don’t understand',n:1,m:'M42 90 Q60 72 78 90',e:'M30 44 L50 52 M90 44 L70 52'},
{k:'o',c:'#ff8a1f',t:'I have questions',n:2,m:'M46 86 H74',e:''},
{k:'y',c:'#ffd21f',t:'I mostly understand',n:3,m:'M44 82 Q60 94 76 82',e:''},
{k:'g',c:'#32d15b',t:'I understand everything!',n:4,m:'M38 78 Q60 106 82 78 Z',e:''}];
const v={r:0,o:0,y:0,g:0},hist=[];
const face=d=>`<svg viewBox="0 0 120 120" aria-hidden="true"><line x1="60" y1="26" x2="60" y2="12" stroke="#1d1457" stroke-width="6" stroke-linecap="round"/><circle cx="60" cy="10" r="8" fill="#fff" stroke="#1d1457" stroke-width="5"/><rect x="16" y="26" width="88" height="82" rx="28" fill="#fff" stroke="#1d1457" stroke-width="6"/><circle cx="42" cy="62" r="9" fill="#1d1457"/><circle cx="78" cy="62" r="9" fill="#1d1457"/><circle cx="45" cy="59" r="3" fill="#fff"/><circle cx="81" cy="59" r="3" fill="#fff"/><path d="${d.e}" stroke="#1d1457" stroke-width="6" stroke-linecap="round" fill="none"/><path d="${d.m}" stroke="#1d1457" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="${d.k==='g'?'#1d1457':'none'}"/>${d.k==='o'?'<text x="88" y="46" font-family="Lilita One,Impact" font-size="30" fill="#1d1457">?</text>':''}</svg>`;
document.getElementById('bats').innerHTML=D.map(d=>`<section class="bat" id="b${d.k}" style="--c:${d.c}"><div class="seg">${[1,2,3,4].map(i=>`<i class="${i<=d.n?'on':''}"></i>`).join('')}</div>${face(d)}<div class="plate">${d.t}</div><button class="big" data-k="${d.k}" aria-label="${d.t}"></button><div class="count stroke" id="c${d.k}">0</div></section>`).join('');
document.getElementById('rows').innerHTML=D.map(d=>`<div class="row" style="--c:${d.c}"><i class="dot"></i><div class="bar"><b id="r${d.k}"></b></div><span id="p${d.k}">0 · 0%</span></div>`).join('');
const $=id=>document.getElementById(id);
function render(){
  const N=Math.max(1,+$('N').value||1),t=v.r+v.o+v.y+v.g;
  $('ans').textContent=`Answered: ${t} / ${N}`;
  D.forEach(d=>{const p=t?Math.round(v[d.k]/t*100):0;$('c'+d.k).textContent=v[d.k];$('r'+d.k).style.width=p+'%';$('p'+d.k).textContent=`${v[d.k]} · ${p}%`});
  const o=t?Math.round((v.o+2*v.y+3*v.g)/(3*t)*100):0;
  $('pct').textContent=o+'%';$('g').style.width=o+'%';
}
document.getElementById('bats').addEventListener('click',e=>{
  const b=e.target.closest('.big');if(!b)return;
  const k=b.dataset.k;v[k]++;hist.push(k);render();
  $('b'+k).animate([{transform:'scale(1)'},{transform:'scale(1.06) rotate(-1.5deg)'},{transform:'scale(1)'}],{duration:260});
});
$('undo').onclick=()=>{const k=hist.pop();if(k){v[k]--;render()}};
$('reset').onclick=()=>{hist.length=0;D.forEach(d=>v[d.k]=0);render()};
$('N').oninput=render;render();
</script>
</body></html>
